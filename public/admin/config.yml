backend:
  name: git-gateway
  branch: main

media_folder: "public/assets"
public_folder: "/assets"

collections:
  - name: "students"
    label: "Öğrenciler"
    folder: "public/data/students"
    create: true
    delete: true
    slug: "{{id}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "ID", name: "id", widget: "string", hint: "Öğrenci kimliği (dosya adı olarak kullanılır)" }
      - { label: "Ad Soyad", name: "name", widget: "string" }
      - { label: "Sınıf", name: "class", widget: "string" }
      - label: "Veli İletişim"
        name: "parentContact"
        widget: "object"
        fields:
          - { label: "Telefon", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
      - {
          label: "Dersler",
          name: "subjects",
          widget: "list",
          default: ["Matematik", "Türkçe", "Fen Bilgisi", "İngilizce"],
          field: { label: "Ders", name: "subject", widget: "string" }
        }
      - label: "Devamsızlık Kayıtları"
        name: "attendance"
        widget: "list"
        fields:
          - { label: "Tarih", name: "date", widget: "date" }
          - {
              label: "Katıldı",
              name: "present",
              widget: "boolean",
              default: true,
            }
          - { label: "Not", name: "note", widget: "text", required: false }
      - label: "Notlar"
        name: "grades"
        widget: "list"
        fields:
          - { label: "Ders", name: "subject", widget: "string" }
          - { label: "Not", name: "score", widget: "number", min: 0, max: 100 }
          - {
              label: "Tam Puan",
              name: "maxScore",
              widget: "number",
              default: 100,
            }
          - { label: "Tarih", name: "date", widget: "date" }
          - {
              label: "Tür",
              name: "type",
              widget: "select",
              options: ["Sınav", "Ödev", "Proje", "Performans"],
            }
          - { label: "Açıklama", name: "note", widget: "text", required: false }
      - { label: "Öğretmen Notları", name: "teacherNotes", widget: "text", required: false }
      - {
          label: "Hedefler",
          name: "goals",
          widget: "list",
          field: { label: "Hedef", name: "goal", widget: "string" },
          required: false
        }
      - {
          label: "Başarılar",
          name: "achievements",
          widget: "list",
          field: { label: "Başarı", name: "achievement", widget: "string" },
          required: false
        }
      - {
          label: "Son Güncelleme",
          name: "lastUpdated",
          widget: "datetime",
          default: "",
          required: false
        }

  - name: "student-index"
    label: "Öğrenci Listesi"
    files:
      - label: "Öğrenci Index"
        name: "index"
        file: "public/data/students/index.json"
        fields:
          - label: "Öğrenciler"
            name: "students"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Ad Soyad", name: "name", widget: "string" }
              - { label: "Sınıf", name: "class", widget: "string" }
